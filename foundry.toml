[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["dependencies"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
auto_detect_solc = true
solc = "0.8.25"
fs_permissions = [{ access = "read-write", path = "./" }]
ignored_error_codes = [2424, 3860, 4591, 5574, 8429, 9207, 9170]

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
